baseURL: https://martin-duflo.netlify.app/
theme: hugo-apero
languageCode: en
title: Le site de Martin
author: Martin Duflo
copyright: '&copy;2026 Martin Duflo'  # Footer text, e.g. '© {year} Me'
googleAnalytics: ''
metaDataFormat: yaml
footnoteReturnLinkContents: '&#8617;'
pagination:
  enableEmoji: true
  ignoreFiles:
    - \.Rmd$
    - \.Rmarkdown$
    - _cache$
    - \.knit\.md$
    - \.utf8\.md$
  pagerSize: 5
  preserveTaxonomyNames: true
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      hardwraps: false
      unsafe: true
  highlight:
    style: github
  tableOfContents:
    endLevel: 2
    ordered: false
    startLevel: 2
params:
  comments: utterances
  custom_theme: "noir-et-blanc-hex"
  customheadingFontFamily: Inter
  customtextFontFamily: Opensauceone
  description: cest la description
  favicon: /img/favicon.ico
  giscus:
    category: Comments
    category_id: '[category ID]'
    emit_metadata: '0'
    lang: en
    mapping: pathname
    reactions_enabled: '1'
    repo: MartinDfl/Site-internet
    repo_id: '[REPO ID]='
    theme: 'plum'
  headingFontFamily: sans-serif
  logo: /img/blogophonic-mark-dark.png
  mainSections:
    - project
    - cv
  math:
    renderer: katex
  navallcaps: true
  orgLocal: Anywhere
  orgName: RStudio
  sharing_image: /img/papillons.jpg
  social:
    - icon: github
      icon_pack: fab
      url: https://github.com/apreshill/apero
    - icon: instagram
      icon_pack: fab
      url: https://www.instagram.com/explore/tags/apero/
    - icon: x-twitter
      icon_pack: fab
      url: https://twitter.com/hashtag/apéro
    - icon: impactstory
      icon_pack: ai
      url: https://impactstory.org/u/0000-0002-8082-1890
    - icon: orcid
      icon_pack: ai
      url: http://orcid.org/0000-0002-8082-1890
    - icon: rss
      icon_pack: fas
      url: /blog/index.xml
  socialInFooter: false
  socialInHeader: false
  textFontFamily: sans-serif
  theme:  #c'est celui-ci le bon pour une raison inconnue
  twitter: apreshill
  utterances:
    issue_term: pathname
    label: 'comments :crystal_ball:'
    repo_name: apreshill/apero
    theme: boxy-light
taxonomies:
  category: categories
  series: series
  tag: tags
menu:
  header:
    - name: About
      title: About
      url: /about/
      weight: 1
    - name: CV
      title: CV
      url: /cv/
      weight: 2
    - name: Portfolio
      title: Portfolio
      url: /project/
      weight: 3
privacy:
  disqus:
    disable: false
  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: true
  instagram:
    disable: false
    simple: true
  vimeo:
    disable: false
    enableDNT: true
    simple: true
  x:
    disable: false
    enableDNT: true
    simple: false
  youtube:
    disable: false
    privacyEnhanced: true

security:
  allowContent: ['.*']


